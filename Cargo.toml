[package]
name = "kla"
version = "0.1.1"
edition = "2021"

[[bin]]
name = "kla"
path = "src/bin/main.rs"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
clap = { version = "4.0.14", features = ["derive", "cargo", "string", "env"] }
http = "1.0.0"
reqwest = {version = "0.13", default-features=false,  features = ["blocking", "stream", "gzip", "brotli", "deflate", "rustls", "query", "form"]}
thiserror = "1.0.37"
tokio = { version = "1.21.2", features = ["full"]}
toml = "0.5.9"
url = "2.3.1"
tera = { version = "1", default-features = false }
serde_json = "1.0.88"
git-version = "0.3.5"
regex = "1.8.3"
duration-string = "0.3.0"
serde = { version = "1.0.228", features = ["derive"]}
skim = "0.20.5"
crossbeam-channel = "0.5.15"
log = "0.4.28"
colog = "1.4.0"
aws-sigv4 = "1.3.5"
anyhow = "1.0.100"
chrono = "0.4.42"
aws-credential-types = "1.2.8"
aws-config = "1.8.8"
inquire = "0.9.1"
paste = "1.0.15"
tokio-util = "0.7.17"
futures = "0.3.31"
bytes = "1.11.0"
rayon = "1.11.0"
oauth2 = "5.0.0"
webbrowser = "1.2.1"
oauth2-reqwest = { version = "0.1.0-alpha.3", features = ["blocking"] }
sha2 = "0.11.0"
hex = "0.4.3"
tiny_http = "0.12.0"

[dev-dependencies]
tempfile = "3.27.0"
httpmock = "0.8.3"
